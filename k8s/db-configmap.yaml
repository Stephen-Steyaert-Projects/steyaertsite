# swccg uses a second database ("swccg_db") on this same Postgres instance,
# under the same user - the postgres image only auto-creates POSTGRES_DB on
# first init, so swccg_db needs a one-time manual
# `CREATE DATABASE swccg_db OWNER steyaertsite_user;` after the db pod first
# comes up (see the migration notes).
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
  namespace: steyaertsite
data:
  POSTGRES_DB: "steyaertsite_db"
  POSTGRES_USER: "steyaertsite_user"
