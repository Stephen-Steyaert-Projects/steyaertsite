apiVersion: v1
kind: ConfigMap
metadata:
  name: swccg-config
  namespace: steyaertsite
data:
  PIPELINE: "production"
  ALLOWED_HOSTS: "swccg.steyaert.xyz"
  CSRF_TRUSTED_ORIGINS: "https://swccg.steyaert.xyz"
  DATABASE_ENGINE: "postgresql"
  # Separate database on the same Postgres instance - see db-configmap.yaml.
  DATABASE_NAME: "swccg_db"
  DATABASE_USERNAME: "steyaertsite_user"
  DATABASE_HOST: "db"
  DATABASE_PORT: "5432"
  EMAIL_HOST: "mail"
  EMAIL_PORT: "25"
  DEFAULT_FROM_EMAIL: "noreply@swccg.steyaert.xyz"
