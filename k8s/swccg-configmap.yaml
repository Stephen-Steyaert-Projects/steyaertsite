apiVersion: v1
kind: ConfigMap
metadata:
  name: swccg-config
  namespace: steyaertsite
data:
  PIPELINE: "production"
  ALLOWED_HOSTS: "swccg.steyaert.xyz"
  CSRF_TRUSTED_ORIGINS: "https://swccg.steyaert.xyz"
  DATABASE_ENGINE: "postgresql"
  DATABASE_NAME: "steyaertsite_db"
  # Must match db-configmap.yaml's POSTGRES_USER.
  DATABASE_USERNAME: "REPLACE_ME"
  DATABASE_HOST: "db"
  DATABASE_PORT: "5432"
  EMAIL_HOST: "mail"
  EMAIL_PORT: "25"
  DEFAULT_FROM_EMAIL: "noreply@swccg.steyaert.xyz"
