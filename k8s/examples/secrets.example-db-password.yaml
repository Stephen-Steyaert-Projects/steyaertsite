# Template only - never apply it: it uses the real Secret's name, so it
# would overwrite the live secret with this placeholder. Kept in
# k8s/examples/ because `kubectl apply -f k8s/` doesn't descend into
# subfolders. Real secret created out-of-band:
#
#   kubectl create secret generic db-password --from-literal=password='...' -n steyaertsite
#
# Shared by website, swccg, and the db service itself - same requirement as
# .env.prod today (DATABASE_PASSWORD must match POSTGRES_PASSWORD).
apiVersion: v1
kind: Secret
metadata:
  name: db-password
  namespace: steyaertsite
type: Opaque
stringData:
  password: "REPLACE_ME"
