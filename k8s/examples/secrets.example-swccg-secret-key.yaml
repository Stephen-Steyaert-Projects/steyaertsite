# Template only - never apply it: it uses the real Secret's name, so it
# would overwrite the live secret with this placeholder. Kept in
# k8s/examples/ because `kubectl apply -f k8s/` doesn't descend into
# subfolders. Real secret created out-of-band:
#
#   kubectl create secret generic swccg-secret-key --from-literal=secret-key='...' -n steyaertsite
apiVersion: v1
kind: Secret
metadata:
  name: swccg-secret-key
  namespace: steyaertsite
type: Opaque
stringData:
  secret-key: "REPLACE_ME"
