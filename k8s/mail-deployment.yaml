# Pinned to steyaert-mgr - same reasoning as db-statefulset.yaml. Uses its
# own DKIM key directory (mail_dkim_k3s) rather than the live compose
# stack's (/srv/mail_dkim), to avoid any file-level interference.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail
  namespace: steyaertsite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mail
  template:
    metadata:
      labels:
        app: mail
    spec:
      nodeSelector:
        kubernetes.io/hostname: steyaert-mgr
      containers:
        - name: mail
          image: boky/postfix
          envFrom:
            - configMapRef:
                name: mail-config
          volumeMounts:
            - name: mail-dkim
              mountPath: /etc/opendkim/keys
      volumes:
        - name: mail-dkim
          hostPath:
            path: /srv/mail_dkim_k3s
            type: DirectoryOrCreate
