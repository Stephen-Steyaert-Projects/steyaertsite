apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: steyaertsite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: website
  template:
    metadata:
      labels:
        app: website
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: website
          # CI overrides this with `kubectl set image deployment/website
          # website=ghcr.io/.../steyaert-site:sha-<short>` - :latest here is
          # only the manual-apply default.
          image: ghcr.io/stephen-steyaert-projects/steyaertsite/steyaert-site:latest
          envFrom:
            - configMapRef:
                name: website-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: website-secret-key
                  key: secret-key
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-password
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /
              port: 8000
              httpHeaders:
                - name: Host
                  value: movies.steyaert.xyz
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8000
              httpHeaders:
                - name: Host
                  value: movies.steyaert.xyz
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
