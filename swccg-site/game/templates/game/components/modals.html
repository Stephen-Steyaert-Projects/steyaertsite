<div class="modal fade" id="resign-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content bg-dark text-light border-secondary">
      <div class="modal-header border-secondary">
        <h5 class="modal-title">Resign this game?</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Your opponent will win the game. You can start a new one afterward.
      </div>
      <div class="modal-footer border-secondary">
        <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
        <button type="button" id="confirm-resign-btn" class="btn btn-danger" data-bs-dismiss="modal">Resign</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="leave-room-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content bg-dark text-light border-secondary">
      <div class="modal-header border-secondary">
        <h5 class="modal-title">Leave this room?</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="leave-room-body">
        If a game is in progress, leaving counts as resigning.
      </div>
      <div class="modal-footer border-secondary">
        <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
        <button type="button" id="confirm-leave-btn" class="btn btn-danger" data-bs-dismiss="modal">Leave</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="close-room-modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content bg-dark text-light border-secondary">
      <div class="modal-header border-secondary">
        <h5 class="modal-title">Close this room?</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        This permanently closes the room for both players. The room code will no longer work.
      </div>
      <div class="modal-footer border-secondary">
        <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
        <button type="button" id="confirm-close-room-btn" class="btn btn-danger" data-bs-dismiss="modal">Close Room</button>
      </div>
    </div>
  </div>
</div>
