<div id="ready-panel" class="card bg-dark border-secondary mb-4 d-none">
  <div class="card-body">
    <h5 class="card-title">Game <span id="ready-game-number">1</span> — you're on the <span id="my-side">—</span></h5>
    <div class="d-flex gap-2 align-items-center">
      <select id="ready-deck-select" class="form-select bg-dark text-light border-secondary" style="max-width: 320px;"></select>
      <button id="ready-btn" class="btn btn-primary">Ready</button>
    </div>
    <div id="location-select-row" class="d-flex gap-2 align-items-center mt-3 d-none">
      <select id="location-select" class="form-select bg-dark text-light border-secondary" style="max-width: 320px;"></select>
      <button id="confirm-location-btn" class="btn btn-primary">Confirm Starting Location</button>
    </div>
    <p id="ready-status" class="text-secondary mt-2 mb-0"></p>
    <div id="ready-error" class="text-danger small mt-2"></div>
    <a href="{% url 'game_deck_list' %}" target="_blank" class="btn btn-outline-light btn-sm mt-2">Manage Decks</a>
  </div>
</div>
