[project]
name = "swccg-site"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "django>=5.2.3",
    "djangorestframework>=3.18.0",
    "openpyxl>=3.1.5",
    "pillow>=12.2.0",
    "redis>=8.1.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "daphne>=4.2.3",
    "factory-boy>=3.3.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-django>=4.14.0",
    "python-dotenv>=1.1.0",
]
prod = [
    "gunicorn>=23.0.0",
    "psycopg2-binary>=2.9.10",
    "uvicorn>=0.52.4",
    "whitenoise>=6.12.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "swccg.settings"
python_files = ["tests.py", "test_*.py"]
asyncio_mode = "auto"
