# Example: Automatic deployment workflow
# Rename to deploy.yml to enable automatic deployment

name: Deploy to Production - swccg

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and Push SWCCG Site to GHCR"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      # Only the k8s manifests + Makefile are needed on the runner; the app
      # itself runs from the image pulled by `kubectl set image`.
      - name: Checkout k8s manifests and Makefile
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          sparse-checkout: |
            k8s
            Makefile
          sparse-checkout-cone-mode: false

      - name: Deploy to k3s
        run: |
          TAG=sha-$(echo "${{ github.event.workflow_run.head_sha || github.sha }}" | cut -c1-7)
          kubectl apply -f k8s/
          make k8s-deploy-swccg TAG=$TAG
